name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev ccache lld

      - name: Install latest build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install --upgrade git+https://github.com/kivy/buildozer.git
          pip install --upgrade git+https://github.com/kivy/python-for-android.git

      - name: Build APK with Buildozer
        # Set a browser User-Agent so download mirrors don't block GitHub with 403 Forbidden
        env:
          HTTP_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
        run: |
          buildozer android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSR-Taxi-Bill-APK
          path: bin/*.apk
